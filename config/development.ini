# EdgeWatch Development Configuration
# Development environment settings for local testing

[DEFAULT]
# Core settings
node_id = dev-node-001
cluster_mode = enabled
environment = development
debug = true
log_level = DEBUG

# Network settings
bind_host = localhost
bind_port = 5000
dashboard_port = 8080
metrics_port = 9090

# Database configuration
database_url = postgresql://edgewatch:edgewatch_dev_pass@localhost:5432/edgewatch_dev
database_pool_size = 5
database_max_overflow = 10
database_pool_timeout = 10

# Redis configuration
redis_url = redis://localhost:6379/1
redis_pool_size = 5
redis_socket_timeout = 5

# Gossip protocol settings
gossip_enabled = true
gossip_interval = 10
gossip_fanout = 2
gossip_max_peers = 10

# Security settings
secret_key = edgewatch_dev_secret_key_not_secure
api_key_required = false
rate_limit_enabled = false
rate_limit_requests = 10000
rate_limit_window = 3600

# Monitoring settings
metrics_enabled = true
health_check_interval = 10
alert_thresholds_cpu = 90
alert_thresholds_memory = 95
alert_thresholds_disk = 95

# Logging settings
log_file = logs/edgewatch_dev.log
log_max_size = 10MB
log_backup_count = 2
log_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s

# Performance settings
worker_threads = 2
connection_pool_size = 10
request_timeout = 60
max_content_length = 32MB

# Development settings
hot_reload = true
auto_restart = true
profiling_enabled = true
testing_mode = true

# Backup settings
backup_enabled = false
backup_interval = 7200
backup_retention_days = 7
backup_storage_path = ./backups
