# EdgeWatch Testing Configuration
# Testing environment settings for CI/CD and automated testing

[DEFAULT]
# Core settings
node_id = test-node-001
cluster_mode = disabled
environment = testing
debug = true
log_level = DEBUG

# Network settings
bind_host = localhost
bind_port = 5000
dashboard_port = 8080
metrics_port = 9090

# Database configuration (SQLite for testing)
database_url = sqlite:///test_edgewatch.db
database_pool_size = 1
database_max_overflow = 1
database_pool_timeout = 5

# Redis configuration (mock for testing)
redis_url = redis://localhost:6379/15
redis_pool_size = 1
redis_socket_timeout = 2

# Gossip protocol settings (minimal for testing)
gossip_enabled = false
gossip_interval = 5
gossip_fanout = 1
gossip_max_peers = 3

# Security settings (relaxed for testing)
secret_key = test_secret_key_not_secure
api_key_required = false
rate_limit_enabled = false
rate_limit_requests = 100000
rate_limit_window = 3600

# Monitoring settings
metrics_enabled = false
health_check_interval = 5
alert_thresholds_cpu = 100
alert_thresholds_memory = 100
alert_thresholds_disk = 100

# Logging settings
log_file = test_logs/edgewatch_test.log
log_max_size = 1MB
log_backup_count = 1
log_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s

# Performance settings
worker_threads = 1
connection_pool_size = 2
request_timeout = 10
max_content_length = 1MB

# Testing settings
testing_mode = true
mock_external_services = true
disable_async_tasks = true
fast_startup = true

# Backup settings
backup_enabled = false
backup_interval = 86400
backup_retention_days = 1
backup_storage_path = ./test_backups
