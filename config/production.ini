# EdgeWatch Production Configuration
# Production environment settings for EdgeWatch deployment

[DEFAULT]
# Core settings
node_id = production-node-001
cluster_mode = enabled
environment = production
debug = false
log_level = INFO

# Network settings
bind_host = 0.0.0.0
bind_port = 5000
dashboard_port = 8080
metrics_port = 9090

# Database configuration
database_url = postgresql://edgewatch:edgewatch_secure_pass_2025@edgewatch-database:5432/edgewatch
database_pool_size = 20
database_max_overflow = 30
database_pool_timeout = 30

# Redis configuration
redis_url = redis://edgewatch-redis:6379/0
redis_pool_size = 10
redis_socket_timeout = 5

# Gossip protocol settings
gossip_enabled = true
gossip_interval = 30
gossip_fanout = 3
gossip_max_peers = 50

# Security settings
secret_key = edgewatch_production_secret_key_2025_secure
api_key_required = true
rate_limit_enabled = true
rate_limit_requests = 1000
rate_limit_window = 3600

# Monitoring settings
metrics_enabled = true
health_check_interval = 30
alert_thresholds_cpu = 80
alert_thresholds_memory = 85
alert_thresholds_disk = 90

# Logging settings
log_file = /app/logs/edgewatch.log
log_max_size = 100MB
log_backup_count = 5
log_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s

# Performance settings
worker_threads = 4
connection_pool_size = 50
request_timeout = 30
max_content_length = 16MB

# Backup settings
backup_enabled = true
backup_interval = 3600
backup_retention_days = 30
backup_storage_path = /app/backups
