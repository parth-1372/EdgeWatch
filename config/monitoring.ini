# EdgeWatch Monitoring Configuration
# Comprehensive monitoring setup for all EdgeWatch components

[monitoring]
# Global monitoring settings
enabled = true
collection_interval = 10
aggregation_interval = 60
retention_hours = 72
max_metrics_buffer_size = 10000

# Enabled metric types
enabled_metrics = [
    "cpu_usage",
    "memory_usage", 
    "disk_usage",
    "network_io",
    "edge_node_count",
    "gossip_messages",
    "api_requests",
    "response_times",
    "error_rates"
]

[health_checks]
# Health monitoring configuration
enabled = true
check_interval = 30
timeout = 10
retry_attempts = 3

# Default health checks
[health_checks.api_health]
type = "api_endpoint"
url = "http://localhost:5000/health"
method = "GET"
expected_status = 200
enabled = true

[health_checks.database]
type = "database"
test_query = "SELECT 1"
enabled = true

[health_checks.filesystem_data]
type = "filesystem"
path = "/app/data"
min_free_space_gb = 1.0
enabled = true

[health_checks.cluster_connectivity]
type = "network"
hosts = ["edgewatch-secondary:5000"]
enabled = true

[alerts]
# Alert configuration
enabled = true
suppression_minutes = 15
escalation_minutes = 30

# Alert thresholds
[alerts.thresholds]
cpu_warning = 75
cpu_critical = 90
memory_warning = 80
memory_critical = 95
disk_warning = 85
disk_critical = 95
response_time_warning = 2.0
response_time_critical = 5.0
error_rate_warning = 0.05
error_rate_critical = 0.1

# Notification channels
[notifications]
[notifications.email]
enabled = false
smtp_server = "localhost"
smtp_port = 587
username = ""
password = ""
to_addresses = []

[notifications.webhook]
enabled = true
url = "http://localhost:8080/api/alerts/webhook"
headers = {"Content-Type" = "application/json"}

[notifications.sms]
enabled = false

[prometheus]
# Prometheus integration
enabled = true
port = 9090
host = "0.0.0.0"
update_interval = 10
metrics_path = "/metrics"

[logging]
# Structured logging configuration
level = "INFO"
file = "logs/edgewatch.log"
audit_file = "logs/audit.log"
max_file_size = "100MB"
backup_count = 5
format = "json"

[audit]
# Audit trail configuration
enabled = true
persist_to_database = true
retention_days = 90

[analytics]
# Analytics engine configuration
enabled = true
interval_minutes = 60
retention_days = 30
confidence_threshold = 0.7

# Automated reports
[analytics.reports]
daily_performance = true
weekly_trends = true
monthly_capacity = true

[experiments]
# Experimental framework configuration
enabled = true
max_concurrent = 3
default_duration_minutes = 60

[dashboard]
# Dashboard configuration
enabled = true
port = 8080
refresh_interval = 30
auto_refresh = true

# Dashboard widgets
widgets = [
    "system_overview",
    "performance_metrics", 
    "health_status",
    "active_alerts",
    "recent_events",
    "resource_utilization",
    "api_metrics",
    "cluster_status"
]
