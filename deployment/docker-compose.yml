version: '3.8'

services:
  edgewatch-primary:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: edgewatch-primary
    hostname: edgewatch-primary
    ports:
      - "5000:5000"    # Main EdgeWatch API
      - "8080:8080"    # Dashboard interface
      - "9090:9090"    # Metrics endpoint
    environment:
      - EDGEWATCH_ENV=production
      - EDGEWATCH_NODE_ID=primary-node-001
      - EDGEWATCH_CLUSTER_MODE=enabled
      - EDGEWATCH_PRIMARY_NODE=true
      - DATABASE_URL=sqlite:///data/edgewatch.db
      - LOG_LEVEL=INFO
    volumes:
      - edgewatch_data:/app/data
      - edgewatch_logs:/app/logs
      - ./config/production.ini:/app/config/production.ini:ro
    networks:
      - edgewatch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - edgewatch-database

  edgewatch-secondary:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: edgewatch-secondary
    hostname: edgewatch-secondary
    ports:
      - "5001:5000"    # Main EdgeWatch API
      - "8081:8080"    # Dashboard interface
      - "9091:9090"    # Metrics endpoint
    environment:
      - EDGEWATCH_ENV=production
      - EDGEWATCH_NODE_ID=secondary-node-002
      - EDGEWATCH_CLUSTER_MODE=enabled
      - EDGEWATCH_PRIMARY_NODE=false
      - EDGEWATCH_PEER_NODES=edgewatch-primary:5000
      - DATABASE_URL=sqlite:///data/edgewatch.db
      - LOG_LEVEL=INFO
    volumes:
      - edgewatch_data_secondary:/app/data
      - edgewatch_logs_secondary:/app/logs
      - ./config/production.ini:/app/config/production.ini:ro
    networks:
      - edgewatch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - edgewatch-primary
      - edgewatch-database

  edgewatch-database:
    image: postgres:15-alpine
    container_name: edgewatch-database
    hostname: edgewatch-database
    environment:
      - POSTGRES_DB=edgewatch
      - POSTGRES_USER=edgewatch
      - POSTGRES_PASSWORD=edgewatch_secure_pass_2025
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init-database.sql:/docker-entrypoint-initdb.d/init-database.sql:ro
    networks:
      - edgewatch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgewatch -d edgewatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"  # Expose for external access if needed

  edgewatch-monitoring:
    image: prom/prometheus:v2.45.0
    container_name: edgewatch-prometheus
    hostname: edgewatch-prometheus
    ports:
      - "9000:9090"   # Prometheus web interface
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - edgewatch-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    depends_on:
      - edgewatch-primary

  edgewatch-grafana:
    image: grafana/grafana:10.0.0
    container_name: edgewatch-grafana
    hostname: edgewatch-grafana
    ports:
      - "3000:3000"   # Grafana web interface
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=edgewatch_admin_2025
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - edgewatch-network
    restart: unless-stopped
    depends_on:
      - edgewatch-monitoring

  edgewatch-redis:
    image: redis:7.0-alpine
    container_name: edgewatch-redis
    hostname: edgewatch-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - edgewatch-network
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  edgewatch-nginx:
    image: nginx:1.24-alpine
    container_name: edgewatch-nginx
    hostname: edgewatch-nginx
    ports:
      - "80:80"      # HTTP
      - "443:443"    # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - edgewatch-network
    restart: unless-stopped
    depends_on:
      - edgewatch-primary
      - edgewatch-secondary
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  edgewatch_data:
    driver: local
  edgewatch_logs:
    driver: local
  edgewatch_data_secondary:
    driver: local
  edgewatch_logs_secondary:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  edgewatch-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
