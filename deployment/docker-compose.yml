version: '3.8'

services:
  edgewatch-primary:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: edgewatch-primary
    hostname: edgewatch-primary
    ports:
      - "5000:5000"    # Main EdgeWatch API
      - "8080:8080"    # Dashboard interface
    environment:
      - EDGEWATCH_ENV=development
      - EDGEWATCH_NODE_ID=primary-node-001
      - LOG_LEVEL=INFO
    volumes:
      - edgewatch_data:/app/data
      - edgewatch_logs:/app/logs
    networks:
      - edgewatch-network
    restart: unless-stopped

volumes:
  edgewatch_data:
    driver: local
  edgewatch_logs:
    driver: local

networks:
  edgewatch-network:
    driver: bridge
