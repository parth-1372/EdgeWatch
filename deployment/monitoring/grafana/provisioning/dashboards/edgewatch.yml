# EdgeWatch Grafana Dashboard Configuration
# Automated dashboard provisioning for comprehensive monitoring

apiVersion: 1

providers:
  - name: 'EdgeWatch Dashboards'
    orgId: 1
    folder: 'EdgeWatch'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
