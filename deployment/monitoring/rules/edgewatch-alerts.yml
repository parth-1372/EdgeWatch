# EdgeWatch Prometheus Alert Rules

groups:
  - name: edgewatch-system
    rules:
      # High CPU usage
      - alert: EdgeWatchHighCPU
        expr: edgewatch_system_cpu_usage_percent > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "EdgeWatch node {{ $labels.instance }} has high CPU usage"
          description: "CPU usage is {{ $value }}% for more than 5 minutes"
          
      - alert: EdgeWatchCriticalCPU
        expr: edgewatch_system_cpu_usage_percent > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "EdgeWatch node {{ $labels.instance }} has critical CPU usage"
          description: "CPU usage is {{ $value }}% for more than 2 minutes"
          
      # High memory usage
      - alert: EdgeWatchHighMemory
        expr: edgewatch_system_memory_usage_percent > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "EdgeWatch node {{ $labels.instance }} has high memory usage"
          description: "Memory usage is {{ $value }}% for more than 5 minutes"
          
      - alert: EdgeWatchCriticalMemory
        expr: edgewatch_system_memory_usage_percent > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "EdgeWatch node {{ $labels.instance }} has critical memory usage"
          description: "Memory usage is {{ $value }}% for more than 2 minutes"
          
      # High disk usage
      - alert: EdgeWatchHighDisk
        expr: edgewatch_system_disk_usage_percent > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "EdgeWatch node {{ $labels.instance }} has high disk usage"
          description: "Disk usage is {{ $value }}% for more than 10 minutes"
          
      - alert: EdgeWatchCriticalDisk
        expr: edgewatch_system_disk_usage_percent > 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "EdgeWatch node {{ $labels.instance }} has critical disk usage"
          description: "Disk usage is {{ $value }}% for more than 5 minutes"

  - name: edgewatch-application
    rules:
      # Node connectivity
      - alert: EdgeWatchNodeDown
        expr: up{job=~"edgewatch-.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "EdgeWatch node {{ $labels.instance }} is down"
          description: "Node has been down for more than 1 minute"
          
      # High error rate
      - alert: EdgeWatchHighErrorRate
        expr: rate(edgewatch_api_requests_total{status_code=~"5.."}[5m]) / rate(edgewatch_api_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "EdgeWatch {{ $labels.instance }} has high error rate"
          description: "Error rate is {{ $value | humanizePercentage }} for more than 5 minutes"
          
      # High response time
      - alert: EdgeWatchHighResponseTime
        expr: histogram_quantile(0.95, rate(edgewatch_api_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "EdgeWatch {{ $labels.instance }} has high response time"
          description: "95th percentile response time is {{ $value }}s for more than 5 minutes"
          
      # Low throughput
      - alert: EdgeWatchLowThroughput
        expr: rate(edgewatch_api_requests_total[5m]) < 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "EdgeWatch {{ $labels.instance }} has low throughput"
          description: "Request rate is {{ $value }} requests/second for more than 10 minutes"

  - name: edgewatch-gossip
    rules:
      # Gossip message failures
      - alert: EdgeWatchGossipFailures
        expr: rate(edgewatch_gossip_messages_total{status="error"}[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "EdgeWatch {{ $labels.instance }} has gossip message failures"
          description: "Gossip error rate is {{ $value }} errors/second for more than 3 minutes"
          
      # High gossip latency
      - alert: EdgeWatchHighGossipLatency
        expr: histogram_quantile(0.95, rate(edgewatch_gossip_latency_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "EdgeWatch {{ $labels.instance }} has high gossip latency"
          description: "95th percentile gossip latency is {{ $value }}s for more than 5 minutes"

  - name: edgewatch-database
    rules:
      # Database connection issues
      - alert: EdgeWatchDatabaseConnections
        expr: edgewatch_database_connections < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "EdgeWatch {{ $labels.instance }} has no database connections"
          description: "No active database connections for more than 1 minute"
          
      # Database operation failures
      - alert: EdgeWatchDatabaseErrors
        expr: rate(edgewatch_database_operations_total{status="error"}[5m]) > 0.05
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "EdgeWatch {{ $labels.instance }} has database operation errors"
          description: "Database error rate is {{ $value }} errors/second for more than 3 minutes"

  - name: edgewatch-alerts
    rules:
      # Too many critical alerts
      - alert: EdgeWatchTooManyCriticalAlerts
        expr: edgewatch_alerts_active{severity="critical"} > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "EdgeWatch {{ $labels.instance }} has too many critical alerts"
          description: "{{ $value }} critical alerts are active"
          
      # Alert system health
      - alert: EdgeWatchAlertSystemDown
        expr: increase(edgewatch_alerts_total[10m]) == 0 and time() - (time() - 600) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "EdgeWatch {{ $labels.instance }} alert system may be down"
          description: "No alerts generated in the last 10 minutes"
