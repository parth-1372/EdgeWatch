---
# EdgeWatch Docker Compose Override for Health Monitoring
# Enhanced health check configuration for production deployment

version: '3.8'

services:
  edgewatch-primary:
    healthcheck:
      test: ["CMD", "python3", "/app/deployment/health_check.py", "--service", "primary_node", "--timeout", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      edgewatch-database:
        condition: service_healthy
      edgewatch-redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  edgewatch-secondary:
    healthcheck:
      test: ["CMD", "python3", "/app/deployment/health_check.py", "--service", "secondary_node", "--timeout", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      edgewatch-primary:
        condition: service_healthy
      edgewatch-database:
        condition: service_healthy
      edgewatch-redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  edgewatch-database:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgewatch -d edgewatch -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  edgewatch-redis:
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  edgewatch-prometheus:
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  edgewatch-grafana:
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  edgewatch-nginx:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Health monitoring service
  edgewatch-health-monitor:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: edgewatch-health-monitor
    hostname: edgewatch-health-monitor
    environment:
      - EDGEWATCH_ENV=production
      - MONITORING_INTERVAL=60
      - ALERT_THRESHOLD=3
      - LOG_FILE=/app/logs/health_monitor.log
    volumes:
      - edgewatch_logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edgewatch-network
    restart: unless-stopped
    command: ["/bin/bash", "/app/deployment/health_monitor.sh"]
    depends_on:
      - edgewatch-primary
      - edgewatch-secondary
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

volumes:
  edgewatch_health_data:
    driver: local

networks:
  edgewatch-network:
    external: true
