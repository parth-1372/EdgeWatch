version: '3.8'

# Security-hardened Docker Compose configuration for EdgeWatch
# Implements security best practices for production deployment

services:
  edgewatch-primary:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.prod
    container_name: edgewatch-primary
    hostname: edgewatch-primary
    ports:
      - "127.0.0.1:5000:5000"  # Bind to localhost only
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    environment:
      - EDGEWATCH_ENV=production
      - EDGEWATCH_NODE_ID=primary-node-001
      - EDGEWATCH_SECURITY_LEVEL=production
    volumes:
      - edgewatch_data:/app/data:rw
      - edgewatch_logs:/app/logs:rw
      - ./config/production.ini:/app/config/production.ini:ro
    networks:
      edgewatch-secure:
        ipv4_address: 172.20.0.10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/tmp:noexec,nosuid,size=50m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 4096
        hard: 4096
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python3", "/app/deployment/health_check.py", "--service", "primary_node", "--timeout", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  edgewatch-secondary:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.prod
    container_name: edgewatch-secondary
    hostname: edgewatch-secondary
    ports:
      - "127.0.0.1:5001:5000"
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:9091:9090"
    environment:
      - EDGEWATCH_ENV=production
      - EDGEWATCH_NODE_ID=secondary-node-002
      - EDGEWATCH_SECURITY_LEVEL=production
      - EDGEWATCH_PEER_NODES=172.20.0.10:5000
    volumes:
      - edgewatch_data_secondary:/app/data:rw
      - edgewatch_logs_secondary:/app/logs:rw
      - ./config/production.ini:/app/config/production.ini:ro
    networks:
      edgewatch-secure:
        ipv4_address: 172.20.0.11
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/tmp:noexec,nosuid,size=50m
    depends_on:
      - edgewatch-primary
      - edgewatch-database

  edgewatch-database:
    image: postgres:15-alpine
    container_name: edgewatch-database
    hostname: edgewatch-database
    environment:
      - POSTGRES_DB=edgewatch
      - POSTGRES_USER=edgewatch
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
      - ./sql/init-database.sql:/docker-entrypoint-initdb.d/init-database.sql:ro
    networks:
      edgewatch-secure:
        ipv4_address: 172.20.0.20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    secrets:
      - db_password
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgewatch -d edgewatch"]
      interval: 10s
      timeout: 5s
      retries: 5

  edgewatch-redis:
    image: redis:7.0-alpine
    container_name: edgewatch-redis
    hostname: edgewatch-redis
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-keepalive 300
      --timeout 0
    volumes:
      - redis_data:/data:rw
    networks:
      edgewatch-secure:
        ipv4_address: 172.20.0.21
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
    secrets:
      - redis_password
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  edgewatch-nginx:
    image: nginx:1.24-alpine
    container_name: edgewatch-nginx
    hostname: edgewatch-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx:rw
    networks:
      edgewatch-secure:
        ipv4_address: 172.20.0.40
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    depends_on:
      - edgewatch-primary
      - edgewatch-secondary
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Security monitoring service
  edgewatch-security-monitor:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.prod
    container_name: edgewatch-security-monitor
    hostname: edgewatch-security-monitor
    environment:
      - EDGEWATCH_ENV=production
      - SECURITY_MONITORING=enabled
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - edgewatch_logs:/app/logs:rw
      - ./security:/app/security:ro
    networks:
      edgewatch-secure:
        ipv4_address: 172.20.0.50
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["python3", "/app/deployment/network_security.py", "--action", "monitor"]
    depends_on:
      - edgewatch-primary
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

volumes:
  edgewatch_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/edgewatch/data
  edgewatch_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/edgewatch/logs
  edgewatch_data_secondary:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  edgewatch-secure:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
      com.docker.network.driver.mtu: "1500"
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    internal: false
    attachable: false

secrets:
  db_password:
    file: ./secrets/db_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
